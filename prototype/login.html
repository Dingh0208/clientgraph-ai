<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClientGraph AI · 登录</title>
<style>
  :root{--blue:#2f6fed;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fb;--danger:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}
  .card{width:min(380px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 8px 30px rgba(16,24,40,.06)}
  h1{font-size:18px;margin:0 0 4px}
  p{color:var(--muted);font-size:12px;margin:0 0 18px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit}
  input:focus{outline:2px solid #e8f0ff;border-color:var(--blue)}
  button{width:100%;height:38px;margin-top:14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{min-height:20px;margin-top:10px;font-size:12px;color:var(--danger)}
  .foot{margin-top:16px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1>ClientGraph AI</h1>
  <p>单人使用 · 请输入老板密码</p>
  <form id="login" autocomplete="off">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="submit">进入</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="foot">密码只提交到本机服务端，不写入浏览器存储或地址栏。</div>
</main>
<script>
(function () {
  "use strict";
  var form = document.getElementById("login");
  var msg = document.getElementById("msg");
  var button = document.getElementById("submit");
  var params = new URLSearchParams(window.location.search);
  var next = params.get("next") || "/";
  if (next.charAt(0) !== "/" || next.slice(0, 2) === "//") next = "/";

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var password = document.getElementById("password").value;
    if (!password) { msg.textContent = "请输入密码"; return; }
    button.disabled = true;
    msg.textContent = "";
    fetch("/api/auth/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    }).then(function (response) {
      return response.json().then(function (body) { return { ok: response.ok, body: body }; });
    }).then(function (result) {
      if (result.ok) {
        window.location.assign(next);
        return;
      }
      var error = (result.body && result.body.error) || {};
      msg.textContent = error.code === "E_RATE_LIMITED"
        ? "尝试次数过多，请稍后再试"
        : (error.message || "登录失败");
      button.disabled = false;
    }).catch(function () {
      msg.textContent = "无法连接本机服务，请确认程序仍在运行";
      button.disabled = false;
    });
  });
})();
</script>
</body>
</html>
